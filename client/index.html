      #loading-screen {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell',
          'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: white;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      /* Fade out loading screen when React is ready, then .loaded hides it */
      body.loading-screen-exiting #loading-screen {
        opacity: 0;
      }

      /* Curvenote's progress loop, in the middle of the page */
      .progress-loop {
        display: block;
        width: 220px;
        max-width: 70vw;
        height: auto;
      }

      .loading-text {
        margin-top: 20px;
        color: #4b5563;
        font-size: 14px;
      }

      /* Hide loading screen once React takes over */
      .loaded #loading-screen {
        display: none;
      }

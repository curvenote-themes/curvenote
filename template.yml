jtex: v1
title: Curvenote Theme
description: A proxy-friendly theme server for working on Curvenote articles locally, built as a React SPA
version: 0.3.1
license: Restricted. See LICENSE for details.
source: https://github.com/curvenote/core
authors:
  - name: Curvenote
    website: https://curvenote.com
    affiliations:
      - Curvenote
tags:
  - local
  - development
options:
  - type: string
    id: base_path
    description: >-
      URL path prefix for the theme (e.g. /proxy/3000). Injected as window.__BASE_PATH__
      so assets and API calls work behind a proxy. Leave empty when not behind a prefix.
  - type: string
    id: site_id
    description: Site identifier for this deployment (e.g. for analytics or feature flags).
  # The standard MyST site options, as myst's book-theme declares them: myst drops any site option
  # its template doesn't declare, so without these a project's logo_text, logo and hide_* options
  # never reach the theme
  - type: boolean
    id: hide_toc
    description: Hide the table of contents
  - type: boolean
    id: hide_footer_links
    description: Hide the previous/next links in the footer
  - type: boolean
    id: hide_outline
    description: Hide the document outline on all pages
  - type: boolean
    id: hide_title_block
    description: Hide the document title on all pages
  - type: boolean
    id: hide_authors
    description: Hide the authors list on all pages
  - type: boolean
    id: hide_search
    description: Disable the search
  - type: number
    id: outline_maxdepth
    description: The maximum depth to show on the document outline, for example, `2` would show only two depths of headings (e.g. `<H1>` and `<H2>`)
    min: 1
    max: 6
    integer: true
  - type: string
    id: twitter
    description: Twitter handle related to the site
  - type: file
    id: favicon
    description: Local path to favicon image
  - type: file
    id: logo
    description: Local path to logo image
  - type: file
    id: logo_dark
    description: Local path to logo image for dark mode
  - type: string
    id: logo_text
    description: Short text to display next to logo at the top of all pages
  - type: string
    id: logo_url
    description: If specified, link logo to this URL. Otherwise, point to root page.
  - type: string
    id: logo_alt
    description: Alt text to attach to the logo
  - type: string
    id: analytics_google
    description: Google analytics key
  - type: string
    id: analytics_plausible
    description: Plausible analytics key
  - type: boolean
    id: numbered_references
    description: Show references as numbered, rather than in APA-style. Only applies to parenthetical citations
  - type: boolean
    id: folders
    description: Respect nested folder structure in URL paths
  - type: string
    id: internal_domains
    description: >-
      A domain to treat as internal links (no external icon, opens in same tab).
      Supports wildcard subdomains with *. Example: "jupyter.org" or "*.jupyter.org"
  - type: file
    id: style
    description: Local path to a CSS file
build:
  install: npm install --omit=dev
  start: node server/index.js
files:
  - client/**/*
  - server/**/*
  - package.json
  - package-lock.json
  - LICENSE
  - README.md
